[project]
name = "sus-cidadao-engenharia-dados"
version = "0.1.0"
description = "Ingestão de dados e RAG híbrido do SUS Cidadão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0,<7",
    "pydantic>=2.0,<3",
    "requests>=2.31",
    "langchain-chroma>=0.2,<2",
    "langchain-google-genai>=4,<5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*", "storage*", "rag*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
