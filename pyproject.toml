[project]
name = "sus-cidadao-engenharia-dados"
version = "0.1.0"
description = "Ingestão de dados e RAG híbrido do SUS Cidadão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0,<7",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.0,<3",
    "requests>=2.31",
    "langchain-chroma>=0.2,<2",
    "langchain-google-genai>=4,<5",
    "rank-bm25>=0.2.2,<1",
    "sacrebleu>=2.4,<3",
    "rouge-score>=0.1.2,<1",
]

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.67.1",
    "mypy>=2.4.1",
    "pyopenssl==24.2.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*", "storage*", "rag*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "scripts"]
strict = true

[[tool.mypy.overrides]]
module = [
    "scripts.*",
    "approve_v9_release",
    "prepare_v8_retrieval_eval",
    "prepare_v9_next_test_candidate",
    "prepare_v9_retrieval_dev",
    "prepare_v9_test_candidate",
    "promote_v9_next_test",
    "promote_v9_test",
    "publish_consolidated_release",
    "publish_v8_calcium_correction",
    "publish_v9_clarithromycin",
    "validate_v7_retrieval_review",
    "validate_v8_calcium_review",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "dvc: testes que exigem releases ou chunks baixados via DVC (use -m 'not dvc' sem DVC)",
]
