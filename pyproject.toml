[project]
name = "sus-cidadao-engenharia-dados"
version = "0.1.0"
description = "Pipeline de ingestão e armazenamento do SUS Cidadão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0,<7",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
